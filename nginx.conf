server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: every route is served by index.html and handled by React Router
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
